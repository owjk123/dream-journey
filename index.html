<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>造梦江湖之小宝传奇 - 浏览器版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        #container {
            position: relative;
            background: #16213e;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        #game-container {
            display: block;
            width: 940px;
            height: 590px;
        }
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-text {
            color: #e94560;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }
        .loading-bar {
            width: 300px;
            height: 6px;
            background: #0f3460;
            border-radius: 3px;
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #0f3460);
            width: 0%;
            transition: width 0.3s;
        }
        .info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #666;
            font-size: 12px;
        }
        #error {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 20px;
            max-width: 500px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading">
            <div class="loading-text">正在加载造梦江湖...</div>
            <div class="loading-bar">
                <div class="loading-progress" id="progress"></div>
            </div>
            <div id="error"></div>
        </div>
        <div id="game-container"></div>
        <div class="info">Powered by Ruffle</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2026.5.16/ruffle.js"></script>
    <script>
        // 注册Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then((reg) => {
                    console.log('[SW] Service Worker registered:', reg.scope);
                })
                .catch((err) => {
                    console.error('[SW] Registration failed:', err);
                });
        }
        
        // 状态
        const state = {
            player: null,
            loadingProgress: 0,
            loadTimer: null
        };
        
        // 更新进度条
        function updateProgress(percent, text) {
            const progress = document.getElementById('progress');
            const loadingText = document.querySelector('.loading-text');
            if (progress) progress.style.width = percent + '%';
            if (text && loadingText) loadingText.innerText = text;
        }
        
        // 显示错误
        function showError(message) {
            const errorDiv = document.getElementById('error');
            if (errorDiv) {
                errorDiv.innerText = message;
                errorDiv.style.display = 'block';
            }
            updateProgress(100);
            console.error('Game Error:', message);
        }
        
        // 隐藏加载界面
        function hideLoading() {
            const loading = document.getElementById('loading');
            if (loading) {
                loading.classList.add('hidden');
            }
        }
        
        // 主加载函数
        async function initGame() {
            try {
                console.log('Initializing Ruffle...');
                updateProgress(10, '正在初始化Ruffle...');
                
                // 检查Ruffle是否加载
                if (typeof window.RufflePlayer === 'undefined') {
                    throw new Error('Ruffle未正确加载');
                }
                
                console.log('Ruffle version:', window.RufflePlayer.version || 'unknown');
                updateProgress(20, 'Ruffle已就绪');
                
                // 创建播放器 (Ruffle自托管版本的API)
                const player = window.RufflePlayer.createPlayer();
                state.player = player;
                
                // 配置播放器
                player.config = {
                    letterbox: "on",
                    showSwfDownload: false,
                    upgradeToHttps: false,
                    maxExecutionTime: 60
                };
                
                console.log('Player created, attaching to DOM...');
                updateProgress(30, '正在创建播放器...');
                
                // 附加到DOM
                const container = document.getElementById('game-container');
                container.appendChild(player);
                
                // 监听播放器事件
                player.addEventListener('loaded', (e) => {
                    console.log('Ruffle loaded event:', e);
                    updateProgress(100, '加载完成！');
                    setTimeout(hideLoading, 500);
                });
                
                player.addEventListener('error', (e) => {
                    console.error('Ruffle error event:', e);
                    showError('Ruffle运行时错误: ' + (e.error?.message || '未知错误'));
                });
                
                player.addEventListener('log', (e) => {
                    console.log('Ruffle log:', e.message);
                });
                
                // 模拟进度
                state.loadTimer = setInterval(() => {
                    state.loadingProgress += 5;
                    if (state.loadingProgress < 80) {
                        updateProgress(state.loadingProgress);
                    }
                }, 500);
                
                console.log('Loading gamefile.swf...');
                updateProgress(40, '正在加载游戏文件...');
                
                // 加载gamefile (使用相对路径)
                const loadPromise = player.load('./gamefile.swf');
                
                // 设置超时
                const timeoutPromise = new Promise((_, reject) => {
                    setTimeout(() => reject(new Error('加载超时 (60秒)')), 60000);
                });
                
                await Promise.race([loadPromise, timeoutPromise]);
                
                console.log('Gamefile loaded successfully!');
                clearInterval(state.loadTimer);
                updateProgress(100, '加载完成！');
                setTimeout(hideLoading, 500);
                
            } catch (error) {
                console.error('Failed to load game:', error);
                clearInterval(state.loadTimer);
                showError('加载失败: ' + error.message);
            }
        }
        
        // DOM加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, starting game init...');
            // 等待Ruffle脚本完全加载
            setTimeout(initGame, 500);
        });
        
        // 备用：5秒后如果还没加载，显示提示
        setTimeout(() => {
            if (state.player === null) {
                updateProgress(50, '可能需要一些时间加载...');
            }
        }, 5000);
    </script>
</body>
</html>
