<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Journey - Ruffle Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2026.5.14/ruffle.js"></script>
    <style>
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        #container {
            position: relative;
        }
        #game {
            border: 2px solid #4a4a6a;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(100, 100, 150, 0.5);
        }
        #log {
            width: 940px;
            height: 200px;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            overflow-y: auto;
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: 20px;
        }
        #log h3 {
            margin: 0 0 10px 0;
            color: #fff;
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
        }
        .success { color: #0f0; }
        .error { color: #f00; }
        .info { color: #0af; }
    </style>
</head>
<body>
    <h1>Dream Journey - Ruffle Test</h1>
    <div id="status">Loading...</div>
    <div id="container">
        <div id="log">
            <h3>Console Log:</h3>
            <pre id="logContent"></pre>
        </div>
        <div id="ruffle-container"></div>
    </div>
    <script>
        const logEl = document.getElementById('logContent');
        const statusEl = document.getElementById('status');
        
        function log(msg, type = 'info') {
            const prefix = type === 'error' ? '[ERROR]' : type === 'success' ? '[OK]' : '[LOG]';
            logEl.textContent += prefix + ' ' + msg + '\n';
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        }
        
        window.addEventListener('error', function(e) {
            log(e.message + ' at ' + e.filename + ':' + e.lineno, 'error');
        });
        
        window.addEventListener('unhandledrejection', function(e) {
            log('Unhandled promise: ' + e.reason, 'error');
        });
        
        // Check if Ruffle is loaded
        log('Checking Ruffle status...');
        
        if (typeof Ruffle === 'undefined') {
            log('Ruffle not loaded!', 'error');
            statusEl.textContent = 'ERROR: Ruffle failed to load';
            statusEl.className = 'error';
        } else {
            log('Ruffle loaded successfully', 'success');
            
            // Create player
            const player = RufflePlayer.new();
            player.config = {
                "upgradeToHttps": false,
                "maxExecutionTime": 30,
                "unavailableUrl": "ignore",
                "networkHost": "allow"
            };
            
            const container = document.getElementById('ruffle-container');
            container.appendChild(player);
            
            // Load the SWF
            log('Loading SWF...');
            player.load('./zm3.swf').then(() => {
                log('SWF loaded successfully', 'success');
                statusEl.textContent = 'SUCCESS: SWF loaded';
                statusEl.className = 'success';
            }).catch((e) => {
                log('SWF load error: ' + e, 'error');
                statusEl.textContent = 'ERROR: ' + e;
                statusEl.className = 'error';
            });
            
            // Listen for Ruffle events
            player.addEventListener('loaded', (e) => {
                log('Ruffle loaded event: ' + JSON.stringify(e.detail), 'success');
            });
            
            player.addEventListener('error', (e) => {
                log('Ruffle error: ' + JSON.stringify(e.detail), 'error');
            });
            
            player.addEventListener('log', (e) => {
                log('SWF log: ' + e.detail.message, 'info');
            });
        }
    </script>
</body>
</html>
