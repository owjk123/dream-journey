<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>造梦江湖之小宝传奇 - 浏览器版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        #container {
            position: relative;
            background: #16213e;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        #game {
            display: block;
        }
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-text {
            color: #e94560;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }
        .loading-bar {
            width: 300px;
            height: 6px;
            background: #0f3460;
            border-radius: 3px;
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #0f3460);
            width: 0%;
            transition: width 0.3s;
        }
        .info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading">
            <div class="loading-text">正在加载造梦江湖...</div>
            <div class="loading-bar">
                <div class="loading-progress" id="progress"></div>
            </div>
        </div>
        <ruffle-canvas id="game" width="940" height="590"></ruffle-canvas>
        <div class="info">Powered by Ruffle</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2026.5.14/ruffle.js"></script>
    <script>
        // 注册Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then((reg) => {
                    console.log('[SW] Service Worker registered:', reg.scope);
                })
                .catch((err) => {
                    console.error('[SW] Registration failed:', err);
                });
        }
        
        window.RufflePlayer = window.RufflePlayer || {};
        
        // 监听Ruffle加载完成
        document.addEventListener("DOMContentLoaded", function() {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.create_player();
            const gameCanvas = document.getElementById("game");
            gameCanvas.append(player);
            
            // 显示加载进度
            const progress = document.getElementById("progress");
            const loading = document.getElementById("loading");
            
            // 模拟加载进度
            let fakeProgress = 0;
            const progressInterval = setInterval(() => {
                fakeProgress += Math.random() * 10;
                if (fakeProgress > 90) fakeProgress = 90;
                progress.style.width = fakeProgress + "%";
            }, 200);
            
            // 加载gamefile
            player.load("gamefile.swf").then(() => {
                clearInterval(progressInterval);
                progress.style.width = "100%";
                setTimeout(() => {
                    loading.classList.add("hidden");
                }, 500);
                console.log("Game loaded successfully!");
            }).catch((e) => {
                clearInterval(progressInterval);
                progress.style.width = "100%";
                console.error("Failed to load game:", e);
                loading.innerHTML = '<div class="loading-text" style="color: #ff6b6b;">加载失败: ' + e.message + '</div>';
            });
            
            // 处理未捕获的错误
            player.addEventListener("error", (e) => {
                console.error("Ruffle error:", e.error);
            });
        });
    </script>
</body>
</html>
