<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Journey - Ruffle Test</title>
    <style>
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        h1 { margin-bottom: 10px; }
        #container {
            position: relative;
        }
        #game-wrapper {
            width: 940px;
            height: 590px;
            border: 2px solid #4a4a6a;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(100, 100, 150, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #0af;
        }
        #log {
            width: 940px;
            height: 150px;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            overflow-y: auto;
            border-radius: 8px;
            margin-top: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1>Dream Journey - Ruffle Test</h1>
    <div id="status">Loading Ruffle...</div>
    <div id="container">
        <div id="game-wrapper">
            <div id="game-placeholder">Loading SWF...</div>
        </div>
    </div>
    <div id="log">Console output will appear here...</div>
    
    <!-- Load Ruffle from jsDelivr -->
    <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2026.5.14/ruffle.js"></script>
    <script>
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');
        const placeholder = document.getElementById('game-placeholder');
        
        function log(msg) {
            logEl.textContent += msg + '\n';
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        }
        
        window.addEventListener('error', function(e) {
            log('[ERROR] ' + e.message + ' at ' + e.filename + ':' + e.lineno);
        });
        
        window.addEventListener('unhandledrejection', function(e) {
            log('[ERROR] Unhandled promise: ' + e.reason);
        });
        
        // Wait for Ruffle to load
        function checkRuffle() {
            if (typeof Ruffle !== 'undefined') {
                log('[OK] Ruffle loaded!');
                statusEl.textContent = 'Ruffle ready!';
                statusEl.style.color = '#0f0';
                
                // Create Ruffle player
                const ruffle = RufflePlayer.new();
                ruffle.config = {
                    "upgradeToHttps": false,
                    "maxExecutionTime": 60,
                    "logLevel": "debug"
                };
                
                // Replace placeholder
                placeholder.parentNode.replaceChild(ruffle, placeholder);
                
                // Load the SWF
                log('[LOG] Loading zm3.swf...');
                ruffle.load('./zm3.swf').then(() => {
                    log('[OK] SWF loaded successfully!');
                    statusEl.textContent = 'SUCCESS: SWF loaded!';
                    statusEl.style.color = '#0f0';
                }).catch((e) => {
                    log('[ERROR] SWF load error: ' + e);
                    statusEl.textContent = 'ERROR: ' + e;
                    statusEl.style.color = '#f00';
                });
                
                // Listen for Ruffle events
                ruffle.addEventListener('loaded', (e) => {
                    log('[OK] Ruffle loaded event');
                });
                
                ruffle.addEventListener('error', (e) => {
                    log('[ERROR] Ruffle error: ' + JSON.stringify(e.detail));
                });
                
                ruffle.addEventListener('log', (e) => {
                    log('[LOG] ' + e.detail.message);
                });
            } else {
                log('[ERROR] Ruffle not loaded yet, waiting...');
                setTimeout(checkRuffle, 1000);
            }
        }
        
        checkRuffle();
    </script>
</body>
</html>
