<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>造梦江湖1 - 小宝传奇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
#game{width:100%;height:100%}
</style>
</head>
<body>
<div id="game"></div>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
    backgroundColor: '#000000',
    letterbox: 'on',
    polyfills: true,
    autostart: true,
    maxExecutionDuration: 600,
    logLevel: 'warn',
    preferFlash: false,
    openUrlMode: 'allow'
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2026.5.14/ruffle.js"></script>
<script>
(function(){
  const container = document.getElementById('game');
  const player = window.RufflePlayer.newest();
  const instance = player.createPlayer();
  instance.style.width = '100%';
  instance.style.height = '100%';
  container.appendChild(instance);
  instance.load({
    url: 'v3870.swf',
    base: 'https://sda.4399.com/4399swf/upload_swf/ftp7/hanbao/20120107/6/'
  });
})();
</script>
</body>
</html>
